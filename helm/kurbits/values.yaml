# ── Image ────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/kurbits-digital-preservation/kurbits-ais
  tag: latest
  pullPolicy: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# ── Applikation ──────────────────────────────────────────────────────
app:
  flaskEnv: production
  logLevel: info
  gunicorn:
    workers: 2
    threads: 2
  taskWorkers: 3
  secretKey: ""
  encryptionKey: ""
  existingSecret: ""
  extraEnv: []
  extraEnvFrom: []

# ── Service & Route ──────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""
  path: /
  annotations:
    haproxy.router.openshift.io/timeout: 300s
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# ── Lagring ──────────────────────────────────────────────────────────
persistence:
  uploads:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    keep: true

# ── Resurser & probes ────────────────────────────────────────────────
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 5
  failureThreshold: 60

livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ── Säkerhet & schemaläggning ────────────────────────────────────────
podAnnotations: {}
podSecurityContext: {}

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}

# ── PostgreSQL (inbyggd) ─────────────────────────────────────────────
postgresql:
  enabled: true
  image:
    repository: quay.io/sclorg/postgresql-16-c9s
    tag: latest
    pullPolicy: IfNotPresent
  auth:
    username: kurbits
    database: kurbits
    password: ""
    existingSecret: ""
  service:
    port: 5432
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    keep: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnv: []

# ── Extern databas (när postgresql.enabled=false) ────────────────────
externalDatabase:
  url: ""
  existingSecret: ""
  existingSecretKey: DATABASE_URL