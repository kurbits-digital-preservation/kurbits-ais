{{- if not .Values.app.existingSecret }}
{{- $name := include "kurbits.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kurbits.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  SECRET_KEY: {{ include "kurbits.secretData" (dict "ctx" $ "secret" $name "key" "SECRET_KEY" "value" .Values.app.secretKey "generate" (randAlphaNum 64)) }}
  AI_CONFIG_ENCRYPTION_KEY: {{ include "kurbits.secretData" (dict "ctx" $ "secret" $name "key" "AI_CONFIG_ENCRYPTION_KEY" "value" .Values.app.encryptionKey "generate" (randAlphaNum 32 | b64enc)) }}
  {{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
  DATABASE_URL: {{ .Values.externalDatabase.url | b64enc }}
  {{- end }}
{{- end }}