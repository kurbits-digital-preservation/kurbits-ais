{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "kurbits.postgresql.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kurbits.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  database-password: {{ include "kurbits.secretData" (dict "ctx" $ "secret" $name "key" "database-password" "value" .Values.postgresql.auth.password "generate" (randAlphaNum 32)) }}
{{- end }}