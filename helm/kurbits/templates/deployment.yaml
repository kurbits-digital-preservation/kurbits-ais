apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kurbits.fullname" . }}
  labels:
    {{- include "kurbits.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kurbits.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kurbits.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kurbits.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kurbits
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: FLASK_ENV
              value: {{ .Values.app.env | quote }}
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: GUNICORN_WORKERS
              value: {{ .Values.app.gunicornWorkers | quote }}
            - name: GUNICORN_THREADS
              value: {{ .Values.app.gunicornThreads | quote }}
            - name: UPLOAD_FOLDER
              value: /app/uploads
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kurbits.fullname" . }}
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kurbits.fullname" . }}
                  key: DATABASE_URL
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kurbits.fullname" . }}-uploads
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
