{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kurbits.postgresql.fullname" . }}
  labels:
    {{- include "kurbits.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "kurbits.selectorLabels" (dict "ctx" . "component" "database") | nindent 4 }}
{{- end }}