apiVersion: v1
kind: Service
metadata:
  name: {{ include "kurbits.fullname" . }}
  labels:
    {{- include "kurbits.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kurbits.selectorLabels" (dict "ctx" . "component" "app") | nindent 4 }}