site_name: KURBITS AIS Documentation
site_url: https://docs.kurbits.net/

theme:
  name: material
  language: sv # Sätter gränssnittet till svenska
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Change logs: change_logs/index.md
  - User manual:
      - Introduction: user/index.md
      - Getting-started: user/01-getting-started.md
      - Resources: user/02-resources.md
      - Agents: user/03-agents.md
      - Locations: user/04-locations.md
      - Classifications: user/05-classifications.md
      - Flags: user/06-flags.md
      - Acquisitions: user/07-acquisitions.md
      - Search: user/08-search.md
      - Administration: user/09-administration.md
      - Import / Export / Lookups: user/10-lookups-import-export.md
      - Process descriptions: user/11-process-descriptions.md
      - Label designer: user/12-labels.md
      - Deploy with docker: user/13-docker.md
      - Visual-Arkiv: user/visual-arkiv-import.md
  - Installation: installation/docker.md
